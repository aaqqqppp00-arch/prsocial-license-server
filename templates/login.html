<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الإدارة | PR.Social Security Shield</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-wrapper">
        <div class="login-brand-bar">
            <div class="brand-square">PR</div>
            <div class="brand-text">
                <h1>PR.Social Master</h1>
                <p>Enterprise License Management Console</p>
            </div>
        </div>

        <div class="login-box">
            <div class="login-header">
                <h2>تسجيل دخول لوحة التحكم</h2>
                <p>يرجى إدخال بيانات حساب المسؤول المشفرة للوصول</p>
            </div>

            {% if error %}
            <div class="alert alert-error">
                <span class="alert-icon">⚠</span>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="/admin/login" class="login-form">
                <div class="form-group">
                    <label for="username">اسم المستخدم (Admin Username)</label>
                    <input type="text" id="username" name="username" required autocomplete="username" placeholder="admin" autofocus>
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور المشفرة (Encrypted Password)</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••••••">
                </div>

                <button type="submit" class="btn btn-primary btn-block">تسجيل الدخول إلى النظام</button>
            </form>

            <div class="login-footer">
                <span>محمي بتشفير HMAC-SHA256 وقاعدة بيانات Supabase PostgreSQL</span>
            </div>
        </div>
    </div>
</body>
</html>
